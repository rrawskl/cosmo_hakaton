name: Validate release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend scripts --select F
      - run: python -m scripts.compare_historical
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Check database, API and frontend
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 3 --fail http://127.0.0.1:8000/health
          curl --retry 30 --retry-all-errors --retry-delay 3 --fail http://127.0.0.1:3000/api/health
      - if: always()
        run: docker compose logs --tail 60
      - if: always()
        run: docker compose down
